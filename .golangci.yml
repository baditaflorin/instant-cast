version: "2"
run:
  tests: true
linters:
  enable:
    - gocyclo
    - gosec
    - misspell
    - revive
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: _test\.go
    paths:
      - node_modules$
      - node_modules/
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - node_modules$
      - node_modules/
      - third_party$
      - builtin$
      - examples$
