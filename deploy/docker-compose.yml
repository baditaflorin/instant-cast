services:
  app:
    image: ghcr.io/baditaflorin/instant-cast:latest
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - instant-cast-uploads:/data/uploads
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/instant-cast", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - instant-cast

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "25342:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - instant-cast

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles:
      - observability
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - instant-cast

volumes:
  instant-cast-uploads:
  prometheus-data:

networks:
  instant-cast:
    driver: bridge
