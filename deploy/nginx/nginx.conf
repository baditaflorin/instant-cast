events {}

http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

  upstream instant_cast_app {
    server app:8080;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host:25342$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/instant-cast.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/instant-cast.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), display-capture=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location = /metrics {
      return 404;
    }

    location / {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://baditaflorin.github.io" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type" always;
        add_header Access-Control-Max-Age 300 always;
        return 204;
      }

      limit_req zone=api burst=20 nodelay;

      proxy_pass http://instant_cast_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      add_header Access-Control-Allow-Origin "https://baditaflorin.github.io" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type" always;
    }
  }
}
