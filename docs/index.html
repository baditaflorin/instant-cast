<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instant Cast</title>
    <meta
      name="description"
      content="No-account screen recorder with webcam overlay, on-device transcription, and encrypted expiring share links."
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f7f4ed;
        color: #202124;
      }

      main {
        width: min(760px, calc(100vw - 32px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.5rem, 9vw, 5.5rem);
        line-height: 0.92;
        letter-spacing: 0;
      }

      p {
        max-width: 58ch;
        font-size: 1.08rem;
        line-height: 1.6;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      a {
        color: #0a6b6f;
        font-weight: 700;
      }

      small {
        display: block;
        margin-top: 28px;
        color: #5f6368;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Instant Cast</h1>
      <p>
        Pages bootstrap is live. The full recorder app is being built here:
        no-account screen recording, webcam overlay, local transcription, and
        encrypted signed sharing.
      </p>
      <nav aria-label="Project links">
        <a href="https://github.com/baditaflorin/instant-cast">GitHub repository</a>
        <a href="https://www.paypal.com/paypalme/florinbadita">Support on PayPal</a>
      </nav>
      <small>Version 0.0.0-bootstrap · Commit bootstrap</small>
    </main>
  </body>
</html>
